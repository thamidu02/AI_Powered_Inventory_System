name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Backend (.NET Web API + Automated Tests)
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend (.NET API & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (10.0 Preview / Net10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore NuGet dependencies
        run: |
          dotnet restore backend/RestaurantInventory.API/RestaurantInventory.API.csproj
          dotnet restore tests/RestaurantInventory.Component3.Tests/RestaurantInventory.Component3.Tests.csproj
          dotnet restore backend/RestaurantInventory.IntegrationTests/RestaurantInventory.IntegrationTests.csproj

      - name: Build Web API (Release)
        run: dotnet build backend/RestaurantInventory.API/RestaurantInventory.API.csproj --configuration Release --no-restore

      - name: Run Component 3 Tests
        run: dotnet test tests/RestaurantInventory.Component3.Tests/RestaurantInventory.Component3.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Run Integration Tests
        run: dotnet test backend/RestaurantInventory.IntegrationTests/RestaurantInventory.IntegrationTests.csproj --configuration Release --no-restore --verbosity normal

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Frontend (React TypeScript + Vite)
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend (React TypeScript Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/restaurant-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/restaurant-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build production bundle
        run: npm run build

      - name: Upload production web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/restaurant-web/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 3: AI Service (Python FastAPI & Tool Integrity)
  # ─────────────────────────────────────────────────────────────
  ai-service-ci:
    name: AI Service (Python FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python code syntax and imports
        run: |
          python -m py_compile main.py agent.py
          python -m py_compile tools/inventory.py tools/sales.py tools/guided_workflows.py

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Mobile App (Flutter & Dart Verification)
  # ─────────────────────────────────────────────────────────────
  mobile-ci:
    name: Mobile App (Flutter & Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/restaurant_mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Run Flutter unit tests
        run: flutter test
