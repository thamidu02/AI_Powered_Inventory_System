name: Continuous Delivery & Packaging (CD)

on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    branches: [ main ]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Package Backend Release
  # ─────────────────────────────────────────────────────────────
  package-backend:
    name: Package Backend Web API
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (10.0 Preview / Net10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish .NET Web API
        run: |
          dotnet publish backend/RestaurantInventory.API/RestaurantInventory.API.csproj \
            --configuration Release \
            --output ./artifacts/backend-api

      - name: Upload Backend Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-release
          path: ./artifacts/backend-api
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Package Frontend Production Bundle
  # ─────────────────────────────────────────────────────────────
  package-frontend:
    name: Package Frontend React Bundle
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: frontend/restaurant-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/restaurant-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload Frontend Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web-release
          path: frontend/restaurant-web/dist
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Package AI Service
  # ─────────────────────────────────────────────────────────────
  package-ai-service:
    name: Package AI Microservice
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare AI Service Bundle
        run: |
          mkdir -p ./artifacts/ai-service
          cp -r ai-service/* ./artifacts/ai-service/
          rm -rf ./artifacts/ai-service/__pycache__ ./artifacts/ai-service/*/__pycache__

      - name: Upload AI Service Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-release
          path: ./artifacts/ai-service
          retention-days: 14
